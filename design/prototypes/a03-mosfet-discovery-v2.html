const $=s=>document.querySelector(s), panel=$('#panel-body'), primary=$('#primary'), secondary=$('#secondary'), view=$('.lab');let phase='predict',prediction=null,answer=null,voltage=0,history=new Set([0]),feedback=null,zoom=1;const storageKey='a03-mosfet-v2-demo';
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify({phase,prediction,answer,voltage,history:[...history],feedback}));}catch(e){$('#voice-caption').textContent='저장할 수 없어요. 이 화면에서는 계속 실험할 수 있습니다.'}};
const restored=()=>{try{let s=JSON.parse(localStorage.getItem(storageKey)||'null');if(!s)return; if(['predict','observe','check','done'].includes(s.phase)){phase=s.phase;prediction=s.prediction??null;voltage=Number(s.voltage)||0;history=new Set(s.history||[0]);answer=s.answer??null;feedback=s.feedback??null;if(!prediction&&phase!=='predict'){phase='predict';history=new Set([0]);voltage=0;}}}catch(e){}};
const glow=()=>{const svg=$('.scene-svg');svg.querySelectorAll('.inversion-electrons').forEach(n=>n.remove());const show=phase!=='predict'&&voltage>=0.8;const sig=$('#scene-signal');$('#model-bubble').textContent=phase==='predict'?'이 화면은 교육을 위해 구조를 단순화한 nMOS 모형입니다. 실제 소자의 공정과 온도에 따라 값은 달라지며, 실험 결과는 예측을 제출한 다음 확인할 수 있습니다.':'이 장면은 교육용 nMOS 모형입니다. 문턱 전압은 0.7V로 가정하고 누설과 실제 공정 차이는 생략했습니다. VDS=0V일 때 순 드레인 전류는 0A입니다.';sig.classList.toggle('visible',phase==='observe'||phase==='check');if(phase==='predict'){sig.textContent='';$('#scene-label').textContent='구조 살펴보기';$('#lab-caption').textContent='게이트 · 소스 · 드레인 · 실리콘';return;}sig.textContent=show?'전자들이 실리콘 표면에 모였어요':'전압을 올려 변화를 관찰해 보세요';$('#scene-label').textContent='전압 조작 · 전하 분포 관찰';$('#lab-caption').textContent='드레인 전압 차는 0V로 고정';if(!show)return;
 const ns='http://www.w3.org/2000/svg';let g=document.createElementNS(ns,'g');g.setAttribute('class','inversion-electrons ripple');let path=document.createElementNS(ns,'path');path.setAttribute('d','M319 292 Q420 307 532 334 L531 345 Q426 326 319 308 Z');path.setAttribute('fill','#33dbb2');path.setAttribute('fill-opacity','.2');g.appendChild(path);[[359,310],[381,315],[405,319],[430,326],[452,331],[477,336],[500,340]].forEach(([x,y],i)=>{let c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',i%2?3.6:4.4);c.setAttribute('fill','#6affd9');c.setAttribute('stroke','#dffff8');c.setAttribute('stroke-width','1.1');g.appendChild(c)});svg.appendChild(g)};
function base(type,title,sub){$('#kicker').textContent=type;$('#panel-title').textContent=title;$('#step-intro').textContent=sub;$('#voice-caption').textContent=phase==='predict'?'지금은 질문만 들어요.':phase==='observe'?'직접 조작한 결과를 짧게 들려드려요.':phase==='done'?'발견한 원리를 다시 들을 수 있어요.':'생각한 이유를 직접 설명해 보세요.';$('#listen').textContent='▷ '+(phase==='predict'?'질문 듣기':'설명 듣기')}
function choices(items,value,onPick){let div=document.createElement('div');div.className='choices';div.setAttribute('role','radiogroup');div.setAttribute('aria-label',phase==='predict'?'예측할 게이트 전압 선택':'관찰한 전자 위치 선택');items.forEach((t,i)=>{let b=document.createElement('button');b.type='button';b.className='choice'+(value===i?' active':'');b.setAttribute('role','radio');b.setAttribute('aria-checked',String(value===i));b.innerHTML='<span class="circle"></span><span>'+t+'</span>';b.onclick=()=>onPick(i);b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();const v=(i+((e.key==='ArrowUp'||e.key==='ArrowLeft')?-1:1)+items.length)%items.length;div.children[v].click();div.children[v].focus()}};div.appendChild(b)});return div}
function mainAction(label,disabled,cb){primary.textContent=label;primary.disabled=disabled;primary.onclick=cb}
function changeSecondary(html,cb){secondary.innerHTML=html;const retry=$('#retry');if(retry&&cb)retry.onclick=cb}
function resetAll(){phase='predict';prediction=null;answer=null;voltage=0;history=new Set([0]);feedback=null;save();render()}
function render(){panel.replaceChildren();if(phase==='predict'){base('01 · 먼저 예측하기','어느 전압에서 길이 열릴까요?','정답보다 먼저 나만의 가설을 세워보세요.');panel.innerHTML='<div class="prompt"><h2>게이트에 어느 전압을 걸면<br>전자들이 가장 많이 모일까요?</h2><p class="lead">실리콘의 구조를 보고 먼저 예상해 보세요. 실험 결과는 아직 보여주지 않을게요.</p></div>';let index=prediction===null?null:['0','0.6','1.2'].indexOf(prediction);panel.appendChild(choices(['0 V · 전압 없음','0.6 V · 낮은 전압','1.2 V · 높은 전압'],index,(i)=>{prediction=['0','0.6','1.2'][i];render();save()}));panel.insertAdjacentHTML('beforeend','<p class="aside-note">정답을 맞히는 것보다 스스로 예측하는 과정이 중요해요.</p>');mainAction('예측 제출하고 실험 시작 →',prediction===null,()=>{phase='observe';render();save()});changeSecondary('<button class="secondary-action" id="previous">← 학습 경로로 돌아가기</button>');}
else if(phase==='observe'){base('02 · 전압을 직접 바꿔보기','전압을 올리면 무엇이 달라질까요?','낮은 전압과 높은 전압을 비교하세요.');panel.innerHTML='<div class="prompt"><h2>전압을 올리면<br>실리콘 표면에 무슨 일이 생길까요?</h2><p class="lead">0V와 0.8V 이상을 직접 비교해 보세요.</p></div><div class="parameter"><div class="parameter-head"><span>게이트 전압 (VGS)</span><strong id="value">0.0 V</strong></div><input id="voltage" type="range" min="0" max="1.2" step="0.1" value="0" aria-label="게이트 전압 0부터 1.2볼트까지"><div class="ticks"><span>0 V</span><span>0.6 V</span><span>1.2 V</span></div></div><div class="observe-note" id="observation" role="status" aria-live="polite"></div>';const slider=$('#voltage');slider.value=String(voltage);slider.oninput=()=>{voltage=Number(slider.value);history.add(voltage);updateObservation();save()};updateObservation();changeSecondary('<button class="secondary-action" id="retry">↺ 예측부터 다시</button>',resetAll);}
else if(phase==='check'){base('03 · 관찰한 원리 설명하기','전자들은 어디에 모였을까요?','직접 본 장면을 떠올려 설명해 보세요.');panel.innerHTML='<div class="prompt"><h2>게이트 전압을 올렸을 때,<br>전자들은 어디에 모였나요?</h2><p class="lead">정답을 바로 보여주지 않고 관찰을 설명해 보세요.</p></div>';panel.appendChild(choices(['산화막을 지나 게이트로 넘어갔어요.','산화막 아래 실리콘 표면에 모였어요.','게이트 안에만 전자가 머물렀어요.'],answer,(i)=>{answer=i;feedback=null;render();save()}));if(feedback)panel.insertAdjacentHTML('beforeend','<div class="feedback-note" role="status">'+feedback+'</div>');mainAction('내 설명 확인하기 →',answer===null,()=>{if(answer!==1){feedback='다른 관점에서 생각했군요. 산화막은 전기장의 영향을 전달하지만, 전자가 통과하는 길은 아니에요. 그림에서 실리콘 표면을 다시 살펴보세요.';answer=null;render();save()}else{phase='done';render();save()}});changeSecondary('<button class="secondary-action" id="retry">↺ 다시 관찰하기</button>',()=>{phase='observe';render();save()});}
else{base('04 · 실험 완료','전압으로 길을 열었어요!','직접 예측하고 조작한 결과를 설명했어요.');panel.innerHTML='<div class="model-explain"><strong>✦ 핵심 발견</strong>문턱 전압(Vth)을 넘자 전자들이 실리콘 표면에 모여 통로가 열렸어요.<br><br>하지만 통로가 생겼어도 양 끝의 전압 차(Vds)가 0V라서 이 모형에서는 순 드레인 전류가 흐르지 않아요.</div><p class="aside-note">다음에는 열린 통로에 전압 차를 주면 어떻게 되는지 실험해 볼 거예요.</p>';mainAction('다음 실험으로 넘어가기 →',false,()=>{alert('V2 디자인 프로토타입입니다. 실제 다음 레슨 이동은 A02 학습 엔진에서 연결합니다.')});changeSecondary('<button class="secondary-action" id="retry">↺ 한 번 더 실험하기</button><button class="secondary-action" id="previous">← 이전 단계</button>',resetAll);}
 glow();}
function updateObservation(){const v=$('#value');if(!v)return;v.textContent=voltage.toFixed(1)+' V';const obs=$('#observation');obs.textContent=voltage>=0.8?'전압을 높였더니 전자들이 실리콘 표면으로 모였어요. 하지만 양 끝 전압 차가 없어 전류는 흐르지 않아요.':'아직 실리콘 표면에 뚜렷한 통로가 보이지 않아요. 조금 더 올려보세요.';const done=history.has(0)&&[...history].some(x=>x>=0.8);mainAction(done?'비교 완료 · 설명해 보기 →':'0V와 0.8V 이상을 비교해 주세요',!done,()=>{phase='check';answer=null;render();save()});glow()}
$('#model-info').onclick=()=>{let v=$('#model-bubble').classList.toggle('visible');$('#model-info').setAttribute('aria-expanded',String(v))};$('#zoom-in').onclick=()=>{zoom=Math.min(1.4,zoom+.12);view.style.setProperty('--zoom',zoom)};$('#zoom-out').onclick=()=>{zoom=Math.max(.85,zoom-.12);view.style.setProperty('--zoom',zoom)};$('#reset-view').onclick=()=>{zoom=1;view.style.setProperty('--zoom',zoom)};$('#listen').onclick=()=>{const speech=phase==='predict'?'게이트에 어느 전압을 걸면 전자들이 가장 많이 모일까요? 먼저 예상해 보세요.':phase==='observe'?'게이트 전압을 움직여 실리콘 표면을 살펴보세요.':phase==='check'?'전자들은 어디에 모였을까요? 직접 관찰한 장면을 떠올려 보세요.':'문턱 전압을 넘자 전자들이 표면에 모여 통로가 열렸어요. 하지만 양 끝의 전압 차가 없어 전류는 흐르지 않아요.';if(!('speechSynthesis' in window)){$('#voice-caption').textContent='음성 미지원 · 화면에서 자막을 읽어주세요.';return};window.speechSynthesis.cancel();let t=new SpeechSynthesisUtterance(speech);t.lang='ko-KR';window.speechSynthesis.speak(t)};$('#exit').onclick=()=>{if(confirm('실험 화면을 나가시겠어요? 이 파일은 디자인 프로토타입이므로 학습 경로 페이지가 연결되어 있지 않습니다.')){alert('나가기 동작은 A02 실제 학습 경로에 연결합니다.')}};restored();render();
window.__a03={getState:()=>({phase,prediction,voltage,history:[...history],answer}),reset:resetAll};
})();
</script></body></html>
