name: A03 V3 Mobile Collision, Catalog & Visual Coverage Browser QA
on:
  push:
    branches:
      - feat/a02-v3-mobile-catalog-visual-coverage
      - feat/a02-p0-lesson12-single-task-flow
      - main
  pull_request:
    branches:
      - feat/a02-v3-mobile-catalog-visual-coverage
      - feat/a02-p0-lesson12-single-task-flow
      - main
  workflow_dispatch:

jobs:
  chromium-v3-qa:
    name: Actual V3 Mobile Collision, Catalog & Visual Coverage Chromium QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated Playwright runner (no lockfile modification)
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Static Analysis (oxlint)
        run: npm run lint

      - name: Unit & Visual Coverage Contract Tests (vitest)
        run: npm test

      - name: TypeScript & Production Build (tsc + vite)
        run: npm run build

      - name: Run V3 Mobile Collision, Catalog & Visual Coverage Browser QA
        run: npm run test:browser:v3

      - name: Upload V3 Browser Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-evidence
          path: browser-evidence/v3/
          if-no-files-found: warn
          retention-days: 14
