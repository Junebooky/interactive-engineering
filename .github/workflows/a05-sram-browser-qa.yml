name: A05 05 SRAM Real Browser QA
on:
  push:
    branches:
      - feat/a05-sram-cache-scenes
  workflow_dispatch:
jobs:
  chromium-sram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (local QA only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real SRAM desktop + mobile browser checks
        run: node scripts/a05-sram-browser.mjs
      - name: Save screenshots even if QA failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-sram05-browser-evidence
          path: browser-evidence/sram05/
          if-no-files-found: warn
          retention-days: 14
