name: A02 Lesson 04 NAND eSSD App Real Browser QA
on:
  push:
    branches:
      - feat/a02-04-nand-nvme-integration
      - feat/a02-14-mos-capacitor-integration
      - main
  pull_request:
    branches:
      - feat/a02-04-nand-nvme-integration
      - feat/a02-14-mos-capacitor-integration
      - main
  workflow_dispatch:

jobs:
  chromium-app-qa:
    name: Actual Lesson 04 NAND eSSD NVMe App Chromium E2E QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated Playwright runner (no lockfile modification)
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real Lesson 04 NAND eSSD NVMe app desktop + mobile browser QA
        run: node scripts/nand-app-browser-smoke.mjs

      - name: Upload Browser QA Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nand-app-browser-evidence
          path: browser-evidence/nand-app/
          if-no-files-found: warn
          retention-days: 14
