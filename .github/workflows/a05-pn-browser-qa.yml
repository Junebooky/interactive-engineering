name: A05 11 PN Real Browser QA
on:
  push:
    branches:
      - feat/a05-11-pn-doping-foundations
  workflow_dispatch:
jobs:
  chromium-pn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser PN five-scene desktop/mobile QA
        run: node scripts/a05-pn-browser.mjs
      - name: Save screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-pn11-browser-evidence
          path: browser-evidence/pn11/
          if-no-files-found: warn
          retention-days: 14
