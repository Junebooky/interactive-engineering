name: A08 Actual App Camera Geometry Contact Sheet
on:
  push:
    branches:
      - test/a08-camera-real-subject-contact-sheet
  workflow_dispatch:
jobs:
  camera-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install actual Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Source quality and regression
        run: |
          npm run lint
          npm test
          npm run build
      - name: Actual official app 18 scenes at 1440 390 320
        run: node scripts/a08-real-subject-camera-audit.mjs
      - name: Export real browser images, 3 contact sheets, measured JSON and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a08-actual-app-geometry-contact-sheets
          path: browser-evidence/a08-camera-p0/
          retention-days: 14
          if-no-files-found: error
