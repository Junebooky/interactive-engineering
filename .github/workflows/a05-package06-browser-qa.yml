name: A05 06 Wafer Chiplet HBM Real Chromium QA
on:
  push:
    branches:
      - feat/a05-06-wafer-chiplet-hbm-2p5d
  workflow_dispatch:
jobs:
  chrome-package06:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install real Chromium browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real source-math and 12 negative Korean Voice paths
        run: node scripts/a05-package06-browser.mjs
      - name: Preserve real screenshots on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-package06-chromium-screenshots
          path: browser-evidence/package06/
          if-no-files-found: warn
          retention-days: 14
