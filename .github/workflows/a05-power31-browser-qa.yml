name: A05 Lesson31 Power Thermal Real Chromium QA
on:
  push:
    branches:
      - feat/a05-31-power-cooling-foundations
  workflow_dispatch:
jobs:
  chrome-power31:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install actual Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Five-stage PSU VRM PDN CDU PUE WUE Chrome physics and 15 wrong pathways
        run: node scripts/a05-power31-browser.mjs
      - name: Preserve full-page browser PNG on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-power31-chromium-screenshots
          path: browser-evidence/power31/
          if-no-files-found: warn
          retention-days: 14
