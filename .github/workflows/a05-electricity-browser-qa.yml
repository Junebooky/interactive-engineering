name: A05 12 Electricity Real Browser QA
on:
  push:
    branches:
      - feat/a05-12-electricity-rc-foundations
  workflow_dispatch:
jobs:
  chromium-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop/mobile real browser actions
        run: node scripts/a05-electricity-browser.mjs
      - name: Archive screenshots even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-electricity12-browser-evidence
          path: browser-evidence/electricity12/
          if-no-files-found: warn
          retention-days: 14
