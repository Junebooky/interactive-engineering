name: A05 09 eSSD Reliability Real Chromium QA
on:
  push:
    branches:
      - feat/a05-09-essd-reliability
  workflow_dispatch:
jobs:
  chrome-ssd09:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install actual Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Four-stage threshold WAF ordered PLP and 100-card nearest-rank browser QA
        run: node scripts/a05-ssd09-browser.mjs
      - name: Persist screenshot evidence on pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-ssd09-real-chromium-screenshots
          path: browser-evidence/ssd09/
          if-no-files-found: warn
          retention-days: 14
